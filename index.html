<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার সুন্দর ওয়েবসাইট</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #071a3d, #163b70);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      margin: auto;
      padding: 50px 0;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      color: #222;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      text-decoration: none;
      color: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .call {
      background: #16a34a;
    }

    .facebook {
      background: #1877f2;
    }

    .instagram {
      background: #e1306c;
    }

    .gmail {
      background: #ea4335;
    }

    .btn:hover {
      opacity: 0.85;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>আমার ওয়েবসাইট</h1>

    <p>
      আমার ওয়েবসাইটে আপনাকে স্বাগতম ❤️
    </p>

    <div class="card">

      <h2>আমার সাথে যোগাযোগ করুন</h2>

      <!-- Call Button -->
      <a class="btn call" href="tel:+8801930331034">
        📞 কল করুন
      </a>

      <!-- Facebook -->
      <a class="btn facebook"
         href="https://facebook.com/"
         target="_blank">
        📘 Facebook
      </a>

      <!-- Instagram -->
      <a class="btn instagram"
         href="https://instagram.com/"
         target="_blank">
        📷 Instagram
      </a>

      <!-- Gmail -->
      <a class="btn gmail"
         href="mailto:moktarid032@gmail.com">
        ✉️ Gmail
      </a>

    </div>

    <footer>
      © 2026 আমার ওয়েবসাইট
    </footer>

  </div>

</body>
</html>
